  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Clone game source
        uses: actions/checkout@v4
        with:
          repository: Faizankhan17623/OpenCity
          ref: main
          path: game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Capacitor
        run: |
          cd game
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # www folder banao — Capacitor ka webDir subdirectory hona chahiye
          mkdir -p www
          # Game ke saare files copy karo
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.png" -o -name "*.svg" -o -name "*.mp3" -o -name "*.ogg" -o -name "*.wasm" \) -exec cp {} www/ \;
          # Subfolders copy karo
          for dir in assets models textures scripts audio data; do
            [ -d "$dir" ] && cp -r "$dir" www/
          done

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.gta.driving",
            "appName": "GTA Driving",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: game/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Driving-Android-APK
          path: game/android/app/build/outputs/apk/debug/app-debug.apk   
