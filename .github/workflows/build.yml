name: Build GTA Game (APK + EXE)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # ==================== ANDROID APK ====================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Clone game source
        uses: actions/checkout@v4
        with:
          repository: Faizankhan17623/OpenCity
          ref: main
          path: game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Capacitor
        run: |
          cd game
          npm install @capacitor/core @capacitor/cli @capacitor/android

          mkdir -p www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.mjs" -o -name "*.css" -o -name "*.json" -o -name "*.png" -o -name "*.svg" -o -name "*.mp3" -o -name "*.ogg" -o -name "*.wasm" \) -exec cp {} www/ \;
          for dir in assets models textures scripts audio data src; do
            [ -d "$dir" ] && cp -r "$dir" www/
          done

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.gta.driving",
            "appName": "GTA Driving",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: game/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Driving-Android-APK
          path: game/android/app/build/outputs/apk/debug/app-debug.apk

  # ==================== WINDOWS EXE ====================
  build-pc:
    runs-on: windows-latest
    steps:
      - name: Clone game source
        uses: actions/checkout@v4
        with:
          repository: Faizankhan17623/OpenCity
          ref: main
          path: game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Electron app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app
          Copy-Item -Path "game\*" -Destination "app\" -Recurse -Force

          # Game ka package.json overwrite karo (ESM conflict fix)
          @'
          {
            "name": "gta-driving",
            "version": "1.0.0",
            "main": "main.js",
            "build": {
              "appId": "com.gta.driving",
              "productName": "GTA Driving",
              "files": ["index.html", "*.js", "*.mjs", "*.css", "*.json", "*.png", "*.svg", "*.mp3", "*.ogg", "*.wasm", "assets/**/*", "models/**/*", "textures/**/*", "scripts/**/*", "audio/**/*", "data/**/*", "src/**/*", "sw.js"],
              "win": { "target": "portable" }
            }
          }
          '@ | Set-Content -Path "app\package.json" -Encoding UTF8

          # main.js (CommonJS - kyunki package.json me "type":"module" nahi hai)
          @'
          const { app, BrowserWindow } = require('electron');
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 720,
              fullscreen: true,
              autoHideMenuBar: true,
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          '@ | Set-Content -Path "app\main.js" -Encoding UTF8

      - name: Install Electron
        working-directory: app
        shell: pwsh
        run: npm install electron@28 electron-builder@24 --save-dev

      - name: Build EXE
        working-directory: app
        shell: pwsh
        run: npx electron-builder --win portable --publish never

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Driving-Windows-EXE
          path: app/dist/*portable*.exe   
