name: Build Driving Game

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Ready-made driving game clone karo
      - name: Clone driving game
        uses: actions/checkout@v4
        with:
          repository: evolodenok-alt/drive-real-3d
          ref: main

      # Step 2: Godot se Android APK build karo
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrivingGame-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  build-pc:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Same game clone karo
      - name: Clone driving game
        uses: actions/checkout@v4
        with:
          repository: evolodenok-alt/drive-real-3d
          ref: main

      # Step 2: Web build (browser me chalega - PC ke liye)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build web version
        run: |
          npm init -y
          npm install three
          # Godot export for web ya simple web wrapper
          mkdir -p dist
          echo '<iframe src="https://cdn.jsdelivr.net/gh/evolodenok-alt/drive-real-3d@main/web/index.html" style="width:100%;height:100%;border:none">' > dist/index.html
          echo '</iframe>' >> dist/index.html

      - name: Upload PC build
        uses: actions/upload-artifact@v4
        with:
          name: DrivingGame-PC-Web
          path: dist/   
